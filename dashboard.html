<!DOCTYPE html>
<html>
<head>
  <title>Dashboard - Pinnacle Finance</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .topbar {
      background: #111827;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .container {
      padding: 40px;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #ef4444;
      color: white;
    }

    h1 {
      margin: 0;
    }

    .highlight {
      font-size: 24px;
      color: #22c55e;
    }
  </style>
</head>

<body>

  <div class="topbar">
    <h1>Pinnacle Dashboard</h1>
    <button onclick="logout()">Logout</button>
  </div>

  <div class="container">

    <div class="card">
      <h2>Welcome Back 👋</h2>
      <p>Your investment overview is ready.</p>
    </div>

    <div class="grid">

      <div class="card">
        <h3>Total Balance</h3>
        <p class="highlight">$12,450</p>
      </div>

      <div class="card">
        <h3>Active Investments</h3>
        <p class="highlight">5</p>
      </div>

      <div class="card">
        <h3>Monthly Growth</h3>
        <p class="highlight">+8.4%</p>
      </div>

    </div>

    <div class="card">
      <h3>Recent Activity</h3>
      <p>• Portfolio updated</p>
      <p>• New asset added</p>
      <p>• Withdrawal processed</p>
    </div>

  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>
  const supabaseUrl = "YOUR_PROJECT_URL";
  const supabaseKey = "YOUR_ANON_KEY";

  const client = supabase.createClient(supabaseUrl, supabaseKey);

  async function logout() {
    await client.auth.signOut();
    window.location.href = "index.html";
  }
</script>

</body>
</html>
